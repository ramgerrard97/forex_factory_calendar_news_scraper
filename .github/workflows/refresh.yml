name: Forex Factory Refresh

on:
  schedule:
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: forex-factory-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Refresh Forex Factory data
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python -m ff_calendar_toolkit.cli alerts-check

      - name: Save refreshed state and cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            state/alerts/alert_state.json \
            state/upcoming_events.json \
            state/weekly_calendar.json

          if git diff --cached --quiet; then
            echo "No refresh state changes to save."
            exit 0
          fi

          git commit -m "Update Forex Factory refresh state"

          git pull --rebase origin main

          for attempt in 1 2 3
          do
            if git push origin HEAD:main; then
              echo "Refresh state saved."
              exit 0
            fi

            echo "Push attempt $attempt failed. Syncing and retrying..."
            git pull --rebase origin main
            sleep 2
          done

          echo "Could not save refresh state after retries."
          exit 1